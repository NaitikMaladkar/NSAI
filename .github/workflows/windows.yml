name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows MSIX
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install JS dependencies
        run: |
          if (Test-Path package-lock.json) {
            npm ci --legacy-peer-deps
          } else {
            npm install --legacy-peer-deps --no-audit --no-fund
          }
        shell: pwsh

      - name: Configure react-native-windows
        run: npx react-native-windows-init --overwrite --language cs --namespace com.nervesynapse.app --version 0.75.20
        shell: pwsh

      - name: Restore NuGet packages (via msbuild)
        run: |
          $slns = Get-ChildItem -Path windows -Filter "*.sln" -Recurse -ErrorAction SilentlyContinue
          foreach ($sln in $slns) {
            Write-Host "Restoring: $($sln.FullName)"
            msbuild $sln.FullName /t:Restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64 /m /nologo
          }
        shell: pwsh

      - name: Restore NuGet packages for autolinked libraries
        run: |
          # autolinked rnw libraries (async-storage, clipboard, etc.) use packages.config
          # and expect packages at $(SolutionDir)packages — which evaluates from the .sln
          # they were imported into. Run nuget.exe restore on the .sln explicitly.
          $nuget = Get-ChildItem -Path "." -Filter "nuget.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nuget) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
            $nuget = Get-Item "nuget.exe"
          }
          $slns = Get-ChildItem -Path windows -Filter "*.sln" -Recurse -ErrorAction SilentlyContinue
          foreach ($sln in $slns) {
            Write-Host "nuget restore $($sln.FullName)"
            & $nuget.FullName restore $sln.FullName -NonInteractive -PackagesDirectory (Join-Path $sln.DirectoryName "packages")
          }
        shell: pwsh

      - name: Build Windows app (Release x64)
        run: npx react-native run-windows --arch x64 --release --no-launch --no-deploy --logging
        shell: pwsh

      - name: Find and collect artifacts
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = @()
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.msixbundle" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.appx" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Release" }
          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination "artifacts/" -Force
          }
          Write-Host "Found files:"
          Get-ChildItem artifacts/ | Format-Table
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
