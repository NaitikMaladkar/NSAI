name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install .NET Workloads
        run: |
          dotnet workload install maui-windows
          dotnet workload install winui3
        continue-on-error: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps
        shell: pwsh
        continue-on-error: true

      - name: Install JS dependencies (retry)
        run: npm install --legacy-peer-deps
        shell: pwsh

      - name: Configure react-native-windows
        run: |
          npx --yes react-native-windows-init --overwrite --language cs
        shell: pwsh
        continue-on-error: true

      - name: Build Windows app (Release x64)
        run: npx --yes react-native run-windows --arch x64 --release --no-launch --no-deploy --logging
        shell: pwsh
        continue-on-error: true

      - name: Build via MSBuild (fallback)
        if: ${{ success() != true }}
        run: |
          msbuild windows/NerveSynapse/NerveSynapse.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms="x64"
        shell: pwsh

      - name: Find and collect artifacts
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = @()
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.msixbundle" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.appx" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "windows" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Release" }
          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination "artifacts/" -Force
          }
          Write-Host "Found files:"
          Get-ChildItem artifacts/ | Format-Table
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
